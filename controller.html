
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>远程控制器</title>
<style>
:root {
  --bg:#0d0d12; --surface:#16161f; --border:#2a2a3a;
  --accent:#c084fc; --accent2:#f472b6; --text:#f0eeff;
  --muted:#7070a0; --suck:#a78bfa; --vibe:#f9a8d4;
  --danger:#ef4444; color-scheme:dark;
}
* {box-sizing:border-box;margin:0;padding:0}
body {
  background:var(--bg);color:var(--text);
  font-family:'PingFang SC',system-ui,sans-serif;
  min-height:100dvh;padding:32px 20px;
  display:flex;flex-direction:column;gap:20px;
  max-width:420px;margin:0 auto;
}
.title {
  text-align:center;font-size:22px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.status-pill {
  display:flex;align-items:center;justify-content:center;
  gap:8px;font-size:13px;color:var(--muted);
}
.dot {
  width:8px;height:8px;border-radius:50%;
  background:var(--muted);flex-shrink:0;
}
.dot.on {background:#4ade80;box-shadow:0 0 8px #4ade8088}
.card {
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:20px;
  display:flex;flex-direction:column;gap:16px;
}
.slider-row {display:flex;flex-direction:column;gap:10px}
.slider-header {
  display:flex;justify-content:space-between;align-items:baseline;
}
.slider-name {font-size:15px;font-weight:600}
.slider-val {
  font-size:20px;font-weight:700;
  min-width:48px;text-align:right;
}
.slider-val.suck {color:var(--suck)}
.slider-val.vibe {color:var(--vibe)}
input[type=range] {
  -webkit-appearance:none;width:100%;height:8px;
  border-radius:4px;outline:none;cursor:pointer;
}
input[type=range].suck {
  background:linear-gradient(to right,var(--suck) var(--pct,0%),var(--border) var(--pct,0%));
}
input[type=range].vibe {
  background:linear-gradient(to right,var(--vibe) var(--pct,0%),var(--border) var(--pct,0%));
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;width:24px;height:24px;
  border-radius:50%;background:var(--text);box-shadow:0 2px 8px #0006;
}
input[type=range]:disabled {opacity:.35}
.btn-row {display:flex;gap:12px}
button {
  flex:1;padding:16px;border:none;border-radius:16px;
  font-size:15px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:opacity .15s,transform .1s;
}
button:active {transform:scale(.97)}
button:disabled {opacity:.35;cursor:not-allowed}
.btn-connect {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
}
.btn-stop {background:var(--danger);color:#fff;font-size:18px}
.presets {display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preset-btn {
  background:var(--border);color:var(--text);
  font-size:13px;font-weight:600;padding:14px 10px;border-radius:14px;
}
.log {font-size:11px;color:var(--muted);text-align:center;min-height:16px}
</style>
</head>
<body>

<div class="title">🎮 远程控制器</div>

<div class="status-pill">
  <div class="dot" id="dotWs"></div>
  <span id="txtWs">服务器未连接</span>
  &nbsp;·&nbsp;
  <div class="dot" id="dotToy"></div>
  <span id="txtToy">蓝牙端未在线</span>
</div>

<div class="card">
  <div class="slider-row">
    <div class="slider-header">
      <span class="slider-name">吸力</span>
      <span class="slider-val suck" id="suckVal">0</span>
    </div>
    <input type="range" class="suck" id="suckSlider"
      min="0" max="100" value="0" disabled>
  </div>

  <div class="slider-row">
    <div class="slider-header">
      <span class="slider-name">震动</span>
      <span class="slider-val vibe" id="vibeVal">0</span>
    </div>
    <input type="range" class="vibe" id="vibeSlider"
      min="0" max="100" value="0" disabled>
  </div>
</div>

<div class="card">
  <div class="presets">
    <button class="preset-btn" onclick="preset(30,0)" disabled>轻柔 🌸</button>
    <button class="preset-btn" onclick="preset(50,20)" disabled>温柔 ✨</button>
    <button class="preset-btn" onclick="preset(70,0)" disabled>强一点 🌊</button>
    <button class="preset-btn" onclick="preset(80,40)" disabled>波浪 💜</button>
  </div>
</div>

<div class="btn-row">
  <button class="btn-connect" id="connectBtn" onclick="toggleConnect()">
    连接服务器
  </button>
  <button class="btn-stop" id="stopBtn" onclick="stopAll()" disabled>
    停止
  </button>
</div>

<div class="log" id="log"></div>

<script>
const WS_URL = 'wss://miaox-remote-production.up.railway.app';

let ws = null;
let toyOnline = false;
let authenticated = false;
let curSuck = 0;
let curVibe = 0;
let sendTimer = null;

function log(message) {
  document.getElementById('log').textContent = message;
}

function getToken() {
  let token = sessionStorage.getItem('CONTROL_TOKEN');

  if (!token) {
    token = prompt('请输入 Railway 中设置的 CONTROL_TOKEN');

    if (!token || !token.trim()) {
      log('未输入连接令牌');
      return null;
    }

    token = token.trim();
    sessionStorage.setItem('CONTROL_TOKEN', token);
  }

  return token;
}

function setWs(connected) {
  document.getElementById('dotWs').className =
    'dot' + (connected ? ' on' : '');

  document.getElementById('txtWs').textContent =
    connected ? '服务器已验证' : '服务器未连接';

  document.getElementById('connectBtn').textContent =
    connected ? '断开服务器' : '连接服务器';
}

function setToy(online) {
  toyOnline = online;

  document.getElementById('dotToy').className =
    'dot' + (online ? ' on' : '');

  document.getElementById('txtToy').textContent =
    online ? '蓝牙端在线' : '蓝牙端未在线';

  document.getElementById('stopBtn').disabled = !online;

  document.querySelectorAll('input[type=range]').forEach(el => {
    el.disabled = !online;
  });

  document.querySelectorAll('.preset-btn').forEach(el => {
    el.disabled = !online;
  });

  if (online) {
    startLoop();
  } else {
    stopLoop();
  }
}

function toggleConnect() {
  if (ws && (
    ws.readyState === WebSocket.OPEN ||
    ws.readyState === WebSocket.CONNECTING
  )) {
    if (ws.readyState === WebSocket.OPEN && toyOnline) {
      sendCmd(0, 0);
    }

    ws.close();
    return;
  }

  connect();
}

function connect() {
  const token = getToken();
  if (!token) return;

  log('正在连接服务器…');

  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    log('无法创建服务器连接');
    return;
  }

  const currentWs = ws;

  currentWs.onopen = () => {
    currentWs.send(JSON.stringify({
      type: 'auth',
      role: 'controller',
      token: token
    }));

    log('正在验证身份…');
  };

  currentWs.onmessage = (event) => {
    let data;

    try {
      data = JSON.parse(event.data);
    } catch (e) {
      return;
    }

    if (data.type === 'ready') {
      authenticated = true;
      setWs(true);
      log('身份验证成功，等待蓝牙端上线…');
    }

    if (data.type === 'toy_connected') {
      if (!authenticated) return;
      setToy(true);
      log('蓝牙端已上线');
    }

    if (data.type === 'toy_disconnected') {
      setToy(false);
      curSuck = 0;
      curVibe = 0;
      updateSliders();
      log('蓝牙端已断开');
    }

    if (data.type === 'error') {
      log('服务器错误：' + (data.message || '未知错误'));
    }
  };

  currentWs.onclose = () => {
    if (ws !== currentWs) return;

    authenticated = false;
    setWs(false);
    setToy(false);
    curSuck = 0;
    curVibe = 0;
    updateSliders();
    log('服务器连接已断开');
  };

  currentWs.onerror = () => {
    if (ws !== currentWs) return;
    log('服务器连接错误');
  };
}

function sendCmd(s, v) {
  if (
    !authenticated ||
    !toyOnline ||
    !ws ||
    ws.readyState !== WebSocket.OPEN
  ) return;

  ws.send(JSON.stringify({
    type: 'cmd',
    suck: s,
    vibe: v
  }));
}

function startLoop() {
  stopLoop();

  sendTimer = setInterval(() => {
    if (toyOnline) {
      sendCmd(curSuck, curVibe);
    }
  }, 250);
}

function stopLoop() {
  if (sendTimer) {
    clearInterval(sendTimer);
    sendTimer = null;
  }
}

function updateSliderStyle(el, value) {
  el.style.setProperty('--pct', value + '%');
}

function updateSliders() {
  const suck = document.getElementById('suckSlider');
  const vibe = document.getElementById('vibeSlider');

  suck.value = curSuck;
  vibe.value = curVibe;

  updateSliderStyle(suck, curSuck);
  updateSliderStyle(vibe, curVibe);

  document.getElementById('suckVal').textContent = curSuck;
  document.getElementById('vibeVal').textContent = curVibe;
}

document.getElementById('suckSlider').addEventListener('input', function() {
  curSuck = Number(this.value);
  updateSliderStyle(this, curSuck);
  document.getElementById('suckVal').textContent = curSuck;
  sendCmd(curSuck, curVibe);
});

document.getElementById('vibeSlider').addEventListener('input', function() {
  curVibe = Number(this.value);
  updateSliderStyle(this, curVibe);
  document.getElementById('vibeVal').textContent = curVibe;
  sendCmd(curSuck, curVibe);
});

function preset(s, v) {
  curSuck = s;
  curVibe = v;
  updateSliders();
  sendCmd(s, v);
}

function stopAll() {
  curSuck = 0;
  curVibe = 0;
  updateSliders();
  sendCmd(0, 0);
}

window.addEventListener('pagehide', () => {
  stopLoop();
  if (ws) ws.close();
});
</script>
</body>
</html>
